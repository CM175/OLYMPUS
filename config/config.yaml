behaviors:
  CombatAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 50000
    
    self_play:
      window: 10
      team_change: 100000
      initial_elo: 0.0
      save_steps: 20000
      swap_steps: 10000
      play_against_latest_model_ratio: 0.5
      track_stats_steps: 10000

environment_parameters:
  # Aim/range shaping hints fade out so the final behaviour is learned from damage and kills alone.
  shaping_scale:
    curriculum:
      - name: Hints
        completion_criteria:
          measure: progress
          behavior: CombatAgent
          signal_smoothing: false
          min_lesson_length: 1
          threshold: 0.15
        value: 1.0
      - name: Fading
        completion_criteria:
          measure: progress
          behavior: CombatAgent
          signal_smoothing: false
          min_lesson_length: 1
          threshold: 0.4
        value: 0.3
      - name: Off
        value: 0.0